services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifeos-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_local_dev
      POSTGRES_DB: lifeos_ai
    ports:
      - "5432:5432"
    volumes:
      - lifeos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  lifeos_postgres_data:
